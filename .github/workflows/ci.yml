name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: pip install pytest
      - name: Rodar os testes
        run: pytest -v
